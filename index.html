<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Währungsrechner</title>
  
  <!-- iOS App-Modus aktivieren -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kurse">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --input-bg: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    /* Eingabebereich */
    .input-group {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .amount-input {
      background-color: var(--input-bg);
      border: 1px solid #334155;
      color: var(--text-color);
      font-size: 1.4rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }

    .amount-input:focus {
      border-color: var(--accent-color);
    }

    .btn-reset {
      background-color: #334155;
      color: var(--text-color);
      border: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Karten für Währungen */
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .currency-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag {
      font-size: 1.8rem;
    }

    .code {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .name {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .rate-container {
      text-align: right;
    }

    .converted-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .base-rate {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-refresh {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-refresh:active {
      opacity: 0.7;
    }

    .updated {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Währungsrechner</h1>

    <!-- Eingabe für Euro-Betrag -->
    <div class="input-group">
      <label class="input-label" for="eur-amount">Betrag in Euro (EUR)</label>
      <div class="input-wrapper">
        <input type="number" id="eur-amount" class="amount-input" value="1" min="0" step="any" oninput="updateCalculations()">
        <button class="btn-reset" onclick="resetAmount()">1 € Reset</button>
      </div>
    </div>

    <div id="rates-list">
      <!-- Kurse werden hier dynamisch eingefügt -->
    </div>

    <button class="btn-refresh" onclick="fetchRates()">Kurse aktualisieren</button>
    <div class="updated" id="last-updated">Lade Daten...</div>
  </div>

  <script>
    const currencies = [
      { code: 'EUR', name: 'Euro', flag: '🇪🇺' },
      { code: 'USD', name: 'US-Dollar', flag: '🇺🇸' },
      { code: 'JPY', name: 'Japanischer Yen', flag: '🇯🇵' },
      { code: 'CHF', name: 'Schweizer Franken', flag: '🇨🇭' },
      { code: 'GBP', name: 'Britisches Pfund', flag: '🇬🇧' },
      { code: 'NOK', name: 'Norwegische Krone', flag: '🇳🇴' }
    ];

    let currentRates = {};

    async function fetchRates() {
      const updatedEl = document.getElementById('last-updated');
      updatedEl.innerText = "Aktualisiere...";

      try {
        const response = await fetch('https://open.er-api.com/v6/latest/EUR');
        const data = await response.json();

        if (data.result === "success") {
          currentRates = data.rates;
          renderRates();
          const now = new Date();
          updatedEl.innerText = "Zuletzt aktualisiert: " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else {
          updatedEl.innerText = "Fehler beim Laden der Daten.";
        }
      } catch (error) {
        updatedEl.innerText = "Netzwerkfehler. Bitte Verbindung prüfen.";
      }
    }

    function renderRates() {
      const listEl = document.getElementById('rates-list');
      listEl.innerHTML = '';

      const amount = parseFloat(document.getElementById('eur-amount').value) || 0;

      currencies.forEach(c => {
        const baseRate = currentRates[c.code] !== undefined ? currentRates[c.code] : 0;
        const converted = amount * baseRate;

        // Formatierung festlegen
        let formattedValue = 'N/A';
        let formattedBaseRate = '';

        if (baseRate > 0) {
          // Formatierung für den Gesamtwert
          formattedValue = c.code === 'JPY' 
            ? converted.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 2 })
            : converted.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

          // Kleine Zusatzanzeige des 1-Euro-Kurses (außer bei EUR selbst)
          if (c.code !== 'EUR') {
            const baseRateStr = c.code === 'JPY' ? baseRate.toFixed(2) : baseRate.toFixed(4);
            formattedBaseRate = `<div class="base-rate">1 € = ${baseRateStr} ${c.code}</div>`;
          }
        }
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="currency-info">
            <span class="flag">${c.flag}</span>
            <div>
              <div class="code">${c.code}</div>
              <div class="name">${c.name}</div>
            </div>
          </div>
          <div class="rate-container">
            <div class="converted-value">${formattedValue}</div>
            ${formattedBaseRate}
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function updateCalculations() {
      renderRates();
    }

    function resetAmount() {
      document.getElementById('eur-amount').value = 1;
      renderRates();
    }

    // Beim Start automatisch laden
    fetchRates();
  </script>
</body>
</html>
